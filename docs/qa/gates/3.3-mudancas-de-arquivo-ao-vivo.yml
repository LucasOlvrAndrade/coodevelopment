status_reason: 'Revisor independente em 30/10: dois achados altos. SEC-001 (reproduzido): o nome curto 8.3 do NTFS (GIT~1) e o fluxo alternativo (::$INDEX_ALLOCATION) passam pelo filtro de .git, e um participante grava um hook do git no PC do outro (execução de código no próximo commit). DATA-001: quando a sala junta a nossa escrita e a pasta mudou no meio, a escrita fica no ar para sempre e o arquivo para de circular até reconectar, sem aviso. Mais 8 médios (perda de trabalho no conflito, conflito falso depois de salvar sem mudança, .gitignore furado para nome acentuado, texto que não é UTF-8 corrompido, caixa diferente no mesmo arquivo, conteudoBase sem limite derrubando a sala, varredura cara, testes faltando). Medição em produção boa (20 de 20 abaixo de 2 s) e ACs 1, 4 e 5 cobertos.'
