story: '1.3'
story_title: 'Amigos por busca e pedido'
gate: PASS
status_reason: 'Reavaliação de 27/10 (duas rodadas): os sete achados corrigidos, cada um com teste. A segunda rodada do revisor independente achou quatro ressalvas nas correções (janela entre o sucesso e a linha sair, foco roubado de quem já estava em outro lugar, duas contagens por navegação na fila das Server Actions, pedido que sobrou voltando depois de desfazer), também corrigidas. Gate original: os 5 ACs estão cobertos e a autorização está certa: quem age vem da sessão, aceitar e recusar filtram para = eu, desfazer só acha par com eu. Sem achado alto. Ficam sete achados médios e baixos, quase todos na interface (relação velha na busca, foco perdido, nome acessível) e dois testes que prometem mais do que conferem.'
reviewer: 'Quinn (@qa), via Claude, com revisor independente'
reviewed_revision: 'commit:fe27a65 (gate original em cd6769f)'
updated: '2026-10-27T00:00:00Z'

top_issues:
  - id: 'REL-001'
    severity: medium
    finding: 'BuscaAmigo guarda a relação de cada linha em useState(achado.relacao) e a key é id-tipo. Depois de pedir (vira "Pedido enviado") e o outro recusar, buscar de novo devolve nenhuma, a key não muda e a linha segue com "Pedido enviado" desabilitado: não dá para pedir de novo (contraria a A10). Variante: aceitar pela seção de pedidos deixa a linha da busca com "Aceitar pedido", que então falha.'
    suggested_action: 'Contador de buscas na key e refazer a última busca quando os dados da página mudarem.'
  - id: 'TEST-001'
    severity: medium
    finding: 'O teste diz que os ids com maiúsculas provam a ordem do par pelo banco, mas no PGlite a collation é C e "Zl9lucas" < "apai7Q" também no JavaScript: trocar least/greatest por comparação no JS não quebra a suíte.'
    suggested_action: 'Ids que se ordenam diferente em UTF-16 (JS) e em bytes UTF-8 (collation C), como "\u{1F600}a" e "Ａb".'
  - id: 'A11Y-001'
    severity: low
    finding: 'O nome acessível "Aceitar o pedido de Pai" não contém o texto visível "Aceitar pedido" (WCAG 2.5.3); comando de voz falha.'
    suggested_action: 'Aceitar pedido de {nome}.'
  - id: 'A11Y-002'
    severity: low
    finding: 'Foco cai no body: "Pedir amizade" é trocado por outro botão desabilitado; aceitar, recusar e desfazer removem a linha no refresh, e o AlertDialog devolve o foco a um botão que sumiu.'
    suggested_action: 'Manter o mesmo botão com aria-disabled e levar o foco ao aviso quando a linha some.'
  - id: 'REL-002'
    severity: low
    finding: 'PedidosRecebidos tem um só "respondendo": responder ao segundo pedido antes da resposta do primeiro reativa os botões do primeiro.'
    suggested_action: 'Um conjunto de ids em andamento.'
  - id: 'REL-003'
    severity: low
    finding: 'O contador de pedidos da barra fica velho na navegação sem recarregar: o layout não é renderizado de novo.'
    suggested_action: 'Atualizar o contador quando a página muda.'
  - id: 'REL-004'
    severity: low
    finding: 'Corrida residual: pedir de novo por uma aba antiga no mesmo instante em que o outro aceita deixa um pedido pendente entre amigos (ja_amigos lê o início da instrução; o ON CONFLICT já vê o delete).'
    suggested_action: 'Ignorar pedidos entre amigos nas listas e no contador.'
  - id: 'TEST-002'
    severity: low
    finding: 'O teste das Server Actions diz que a página é atualizada, mas só confere o refresh do pedir.'
    suggested_action: 'Conferir o refresh nas quatro ações que mudam dados.'

