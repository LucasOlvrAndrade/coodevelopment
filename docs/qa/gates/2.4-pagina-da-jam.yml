schema: 1
story: '2.4'
story_title: 'Página da jam'
gate: CONCERNS
status_reason: 'Gate de 28/10, com revisor independente. Acesso certo: só participante abre a página, a 404 não distingue "não existe" de "não participa" (mesma consulta, mesma tela), só o criador exclui e a exclusão não chama o GitHub (a regra nem recebe GitHub). A troca de estilo do f773e81 não mudou comportamento. Ficam dois médios: o resultado de "Chamar mais amigos" se perde no caminho mais comum (A11Y-001) e o AC 4 (celular) sem evidência (TEST-001); e baixos de validação, tela e testes.'
reviewer: 'Quinn (@qa), via Claude, com revisor independente'
reviewed_revision: 'commit:939f3e5 (implementação em c2506e8 e f52a7dc; estilo em f773e81)'
updated: '2026-10-28T00:00:00Z'

top_issues:
  - id: 'A11Y-001'
    severity: medium
    finding: 'O refresh() da ação traz a página de volta do servidor: se o amigo chamado era o último disponível, ChamarMaisAmigos cai no retorno antecipado, e se a jam completou ele é desmontado. Nos dois casos somem "foi chamado" e o alerta com o motivo do GitHub, e o foco vai para o body. O mesmo com "Tentar de novo" que dá certo (o botão some).'
    suggested_action: 'Mensagem numa região que sobrevive ao refresh e foco nela quando o botão some; teste com a página renderizada de novo depois da ação.'
  - id: 'TEST-001'
    severity: medium
    finding: 'AC 4 (celular) sem teste nem registro: o Playwright só tem Desktop Chrome e não há E2E de /jams/[id].'
    suggested_action: 'Registrar a conferência em 320 e 375 px, com o diálogo de excluir e axe; projeto Playwright de celular quando houver a branch de teste do Neon.'
  - id: 'REL-001'
    severity: low
    finding: 'O id da rota vai direto ao banco, e o idJam das ações só confere o tamanho (um id com caractere de controle deve virar erro 22021 do Postgres, logado como inesperado; suspeita, não executada).'
    suggested_action: 'Validador no formato do gerarIdJam, usado na página (notFound antes do banco) e nas ações.'
  - id: 'REL-002'
    severity: low
    finding: 'Jam excluída em outra aba: "Excluir jam" e "Tentar de novo" mostram "não existe ou não é sua" e a página fica onde está; o router.push deixa a jam excluída no histórico; exclusão que passou com a resposta perdida, ao repetir, dá erro.'
    suggested_action: 'router.replace, jam_nao_encontrada ao excluir como exclusão feita e router.refresh no tentar de novo.'
  - id: 'REL-003'
    severity: low
    finding: 'A página da jam não confere os convites pendentes no GitHub: mostra "falta aceitar" até alguém abrir o Início (achado do revisor da reavaliação da 2.3).'
    suggested_action: 'A mesma conferência do Início, com prazo.'
  - id: 'UX-002'
    severity: low
    finding: 'Cancelar e Esc continuam ativos durante "Excluindo...": o diálogo fecha, mas a jam é excluída e a página vai para o Início; o erro de uma tentativa anterior reaparece ao reabrir.'
    suggested_action: 'Ignorar o fechamento enquanto exclui, Cancelar desabilitado e erro limpo ao abrir.'
  - id: 'A11Y-002'
    severity: low
    finding: 'ul com role="alert" deixa os li sem lista (regra listitem do axe).'
    suggested_action: 'div role="alert" com a ul dentro.'
  - id: 'A11Y-003'
    severity: low
    finding: 'Veio do f773e81: no selo, "Aberta" e "branch" ficaram grudados no texto ("Abertabranch main").'
    suggested_action: 'Separador sr-only ou visível.'
  - id: 'UX-003'
    severity: low
    finding: 'Celular, por cálculo: em 320 px o selo corta o código; @usuário longo é cortado nas linhas de amigo (sem min-w-0); o diálogo não tem altura máxima nem rolagem.'
    suggested_action: 'Selo mais curto, linhas que quebram e max-h com rolagem no diálogo.'
  - id: 'UX-004'
    severity: low
    finding: 'Texto com gênero fixo: "Ana foi chamado para a jam."'
    suggested_action: 'Frase neutra.'
  - id: 'UX-005'
    severity: low
    finding: 'Veio do f773e81: no Início, o nome do repositório perdeu a cor de link e não tem sublinhado; no celular nada indica que abre a jam (caminho do AC 1).'
    suggested_action: 'A classe link.'
  - id: 'TEST-002'
    severity: low
    finding: 'Sem teste da 404 renderizada, de nome, usuário e foto, de Cancelar e erro no diálogo, nem de que excluir não chama o GitHub; o teste "id fora do formato" só confere o tamanho.'
    suggested_action: 'Esses testes.'

