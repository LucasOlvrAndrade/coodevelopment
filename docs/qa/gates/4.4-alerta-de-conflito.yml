evidence:
  tools: 'pnpm test (código 0): plugin 15, protocolo 68, sala 75 (workerd), web 352, conector 136 e 1 pulado (137). pnpm lint: código 0. pnpm typecheck: código 0. Rodados um de cada vez em db79236. CodeRabbit não foi rodado.'
  probes: 'Provas temporárias criadas e apagadas, sem alterar o código: sala no workerd com _pk fixo; conector com as funções reais; hook.mjs real contra conector falso; partysocket 1.3.0 real contra servidor WebSocket local. git status limpo no fim.'
  hook: 'Hook real. Normal: ask em 211 ms, com PerguntaEntregue antes da saída. Conector morto depois de responder: ask em 185 ms, sem entrega, e a edição não libera as próximas. Resposta em 1900 ms com entrega pendurada: ask em 2385 ms. Respostas em 1990 ms e 2100 ms: saída vazia em cerca de 2115 ms; a de 1990 ms perdeu o prazo de 2 s nesta medição. Tudo abaixo do timeout de 5 s do hooks.json.'
  close_code: 'partysocket real: socket.close() seguido de saída do processo enviou quadro de fechamento 1000. Queda de TCP não envia quadro; que a Cloudflare entregue um código diferente de 1000 nesse caso não foi conferido em produção. Por leitura de partysocket/dist/ws.js:409-419 e 445-447: erro ou tempo de conexão com o socket ainda OPEN ou CONNECTING chama close(1000); com o mesmo _pk isso pode cair em REL-017 (incerto, não reproduzido). A hibernação não muda o código: partyserver repassa o código de webSocketClose.'
  alarm: 'No workerd: alarme marcado na queda, vencer apaga só o vencido e reagenda o seguinte (119,8 s depois). Em produção não conferido. onClose depois de onError só regrava caiu_em, por leitura.'
  cost: 'todos() não roda a cada mensagem: só em aviso, reserva, entrada e mudança de claudes (duas vezes por anúncio); as escritas de arquivo usam o estado da conexão. Em reserva, roda antes de ignorar o pedido repetido; um conector modificado em loop paga leituras limitadas. Sem achado.'
  compatibility: 'Sala nova com conector 0.6.0 publicado (pacote baixado e lido, não executado): o esquema dele ignora campos extras e usa resumo e arquivos; o aviso sem id é aceito, e o caso sem id tem teste (aviso.test.ts:229). Durante a queda, 0.6.0 continua vendo o aviso do outro por 2 min. Conector novo com sala antiga, por leitura: o esquema antigo (e57ee5c) ignora id e outros, e o conector cai no avisoId ou em desde + resumo (contexto.ts:125). Plugin vai dentro do conector (plugin.ts:56-58); com hook antigo e conector novo, por leitura, a entrega não chega e toda edição pergunta até o /reload-plugins, que o terminal indica. Qual sala está no ar hoje não foi conferido.'
  production: 'Não conferido em produção: não há repositório de teste. Esta revisão não rodou o Claude Code real; leu as gravações da conferência anterior.'
