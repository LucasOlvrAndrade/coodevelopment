top_issues:
  - id: 'REL-017'
    severity: medium
    file: 'apps/sala/src/jam.ts:200-206, apps/sala/src/armazenamento-sqlite.ts:182-184, apps/sala/src/armazenamento-sqlite.ts:201-203, packages/conector/src/sala.ts:50-55, apps/sala/tests/aviso.test.ts:10-12'
    finding: 'Introduzido pelas correções. A tabela aviso_ativo liga cada aviso ao id da conexão, e saiu() apaga ou marca as linhas por esse id. O conector real usa o partysocket, que mantém o mesmo _pk em todas as reconexões (conferido com o partysocket 1.3.0 real: conexão 1 e 2 com o mesmo _pk). Se o socket antigo fechar na sala depois que o novo já entrou, o fechamento atinge o aviso da conexão nova. Cenário 1, provado no workerd: o dono troca de rede, reconecta e reenvia o aviso; o socket antigo fecha com 4000; a linha ganha caiu_em com o dono vivo, o outro participante recebe queda:true e, passada a tolerância, o alarme apaga o aviso e o claudes sai com avisos vazios. Cenário 2, provado: o socket antigo estava sem trabalhandoDesde; ao fechar, limpar() apaga o aviso na hora, sem anunciar. Nos dois casos o conector não reenvia, porque StatusDoClaude.enviado não mudou (hooks.ts:215-221); a edição do outro passa sem pergunta e o Claude dele pode ouvir que os arquivos estão livres. Fere os ACs 1 e 4. Os testes da sala conectam sem _pk e recebem um id novo a cada conexão, por isso não pegam o caso. Incerto: com que frequência o socket antigo fecha depois do novo em produção. O conector não tem ping, e isso depende de quando a Cloudflare percebe a queda.'
    suggested_action: 'Em saiu(), não tocar nas linhas se houver outro socket aberto com o mesmo id, ou gravar nas linhas um identificador do socket em vez do _pk. Repetir o teste da sala com _pk fixo nas duas ordens de fechamento.'
  - id: 'REQ-002'
    severity: medium
    file: 'packages/plugin/scripts/aviso.mjs:94-98, packages/conector/src/contexto.ts:296-298, docs/decisoes.md:132, docs/stories/4.4.story.md:124-127'
    finding: 'DECISÃO DO DONO DO PROJETO. O hook envia o motivo certo, mas a tela do Claude Code 2.1.318 mostra só "Do you want to make this edit to README.md?", 1. Yes, 2. No. Conferi a gravação tela-sim.txt da conferência anterior: a mensagem "PreToolUse:Edit says" aparece depois da pergunta. Não reexecutei o Claude Code, porque o script sobrescreve o marketplace local do usuário. O AC 1 pede a confirmação com o motivo (quem anunciou e o resumo), e isso não ocorre no momento de responder. Cenário: Kelson anuncia no meio da resposta do meu Claude; a edição seguinte devolve ask sem contexto (contexto.ts:296-298), então o Claude também não sabe e não pode avisar; a informação fica na outra janela (terminal do conector, uma vez por arquivo e aviso) e no feed. Inferência, não conferida: no modo padrão, essa tela é igual à de qualquer edição, e a pessoa tende a responder sim por hábito. A documentação atual de hooks do Claude Code (code.claude.com/docs/en/hooks, lida em 04/11) diz que, no ask, o motivo aparece na tela de permissão; o observado contradiz isso.'
    suggested_action: 'O dono escolhe entre: aceitar e registrar a dispensa do trecho "com o motivo" do AC 1; trocar a primeira tentativa por deny com o motivo, para o Claude contar à pessoa, e usar ask na segunda (muda o caminho do AC 3); ou relatar a divergência à Anthropic e reconferir em versões novas. Sem essa decisão, o gate não pode ser PASS.'
