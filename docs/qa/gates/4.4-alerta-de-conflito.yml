story: '4.4'
story_title: 'Alerta de conflito'
gate: CONCERNS
status_reason: 'O fluxo principal funciona e tem teste, e testes, lint e typecheck passam. Há 7 achados médios fora do fluxo principal: a reserva não pergunta com duas sessões do dono, some sem o Claude terminar e pode não chegar à sala; o id do aviso muda na reconexão; a edição segue sem pergunta se o hook estourar o prazo; a ligação em entrar.ts não tem teste e a confirmação interativa não foi conferida.'
reviewer: 'Quinn (@qa), via Claude, revisor independente'
