    finding: 'A chamada a PerguntaEntregue em rodar() não tem teste. Os testes do conector simulam essa chamada, e o do plugin só compara dois prazos entre si. Por leitura, sem rodar a mutação: apagar a linha 127 mantém a suíte verde, mas sem ela a pergunta nunca conta como entregue. O feed e os terminais ficam sem o pedido, e toda edição pergunta de novo, contra os ACs 2 e 3. Os prazos de 2 s e 300 ms também não têm teste. A prova temporária desta revisão passou, mas não fica no repositório.'
