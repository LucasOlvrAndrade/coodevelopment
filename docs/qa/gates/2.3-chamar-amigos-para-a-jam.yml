status_reason: 'Reavaliação de 28/10, com revisor independente: os cinco achados do gate FAIL estão corrigidos e testados. SEC-001: login atual pelo githubId e convidado conferido pelo invitee.id, com o convite errado cancelado; o revisor tentou quebrar (troca de login entre o GET e o PUT, 201 sem invitee, 204) e não conseguiu. SEC-002: jam aberta e amizade reconferidas antes e dentro do insert, também no tentar de novo. REL-001: participante nasce falhou, erro num amigo não para o outro, pendente vira ok no Início. UX-001: resultado de cada amigo antes de sair da tela e motivo no tentar de novo. TEST-001: 23505 simulado e log do aceite. Depois da reavaliação, no mesmo dia: o médio novo (PERF-001) e o SEC-003 corrigidos em 06720a9, e o UX-002 em parte em 7887538. Ficam só baixos.'
reviewer: 'Quinn (@qa), via Claude, com revisor independente'
