schema: 1
story: '2.3'
story_title: 'Chamar amigos para a jam'
gate: FAIL
status_reason: 'A vaga (A12) aguenta a concorrência em READ COMMITTED (conferido pelo revisor) e só o criador chama. Mas o convite usa o login guardado, que pode ter passado para outra pessoa no GitHub, e "tentar de novo" não reconfere amizade nem jam aberta; o estado pendente nunca vira ok sozinho e os erros somem na tela.'
reviewer: 'Quinn (@qa), via Claude, com revisor independente'
reviewed_revision: 'commit:c67b9c6'
updated: '2026-10-27T00:00:00Z'

top_issues:
  - id: 'SEC-001'
    severity: high
    finding: 'O PUT de colaborador usa user.login, que o próprio schema admite ficar velho: o amigo troca o nome no GitHub, outra pessoa registra o nome antigo e é convidada para o repositório (talvez privado); "Tentar de novo" convida o estranho de novo.'
    suggested_action: 'Buscar o login atual pelo githubId (GET /user/{account_id}) antes do PUT e conferir invitee.id na resposta; se não bater, apagar o convite e marcar falhou.'
  - id: 'SEC-002'
    severity: medium
    finding: 'tentarDeNovo (dadosParaColocar) só confere criador e papel: depois que o amigo desfaz a amizade (A10, conta como recusa), o criador ainda o convida de novo e aceita com o token dele; vale até em jam fechada. A conferência de amizade em chamarAmigo também tem uma janela até o insert.'
    suggested_action: 'Exigir amizade e jam aberta em dadosParaColocar e dentro do insert de chamarAmigo.'
  - id: 'REL-001'
    severity: medium
    finding: 'A linha nasce pendente antes do GitHub; um erro que não é ErroApp depois da vaga relança, o amigo fica pendente sem convite, o segundo amigo nem é chamado e o refresh não roda. E quando o amigo aceita pelo link, nada leva pendente a ok (o caminho principal, já que o token do amigo provavelmente não alcança o repositório antes de aceitar).'
    suggested_action: 'Estado inicial que diga "não adicionado"; erro por amigo sem parar os outros; conferir o colaborador no GitHub ao abrir o Início.'
  - id: 'UX-001'
    severity: medium
    finding: 'O resultado de chamarAmigos é ignorado nas duas telas de criar (so_amigos, jam_cheia, falha da ação somem), o motivo do falhou só vai para o log e TentarDeNovo não avisa quando volta falhou.'
    suggested_action: 'Mostrar o resultado de cada amigo antes de ir ao Início; motivo do GitHub traduzido no tentar de novo.'
  - id: 'TEST-001'
    severity: low
    finding: 'O teste da corrida não passa pelo 23505 (PGlite tem uma conexão só); faltam testes de SEC-002 e REL-001; o "500 sobe" do aceite não muda nada porque colocarNoRepositorio engole o erro sem log.'
    suggested_action: 'Simular o 23505 no execute; testes dos itens novos; log do erro inesperado no aceite.'

