story: '2.3'
story_title: 'Chamar amigos para a jam'
gate: CONCERNS
status_reason: 'Reavaliação de 28/10, com revisor independente: os cinco achados do gate FAIL estão corrigidos e testados. SEC-001: login atual pelo githubId e convidado conferido pelo invitee.id, com o convite errado cancelado; o revisor tentou quebrar (troca de login entre o GET e o PUT, 201 sem invitee, 204) e não conseguiu. SEC-002: jam aberta e amizade reconferidas antes e dentro do insert, também no tentar de novo. REL-001: participante nasce falhou, erro num amigo não para o outro, pendente vira ok no Início. UX-001: resultado de cada amigo antes de sair da tela e motivo no tentar de novo. TEST-001: 23505 simulado e log do aceite. Fica um médio novo (PERF-001: o Início espera o GitHub sem prazo) e baixos.'
reviewer: 'Quinn (@qa), via Claude, com revisor independente'
reviewed_revision: 'commit:95416ee (correções; gate original FAIL em c67b9c6)'
updated: '2026-10-28T00:00:00Z'

top_issues:
  - id: 'PERF-001'
    severity: medium
    finding: 'A lista de jams do Início espera sincronizarPendentes: para cada pendente, dois pedidos em série ao GitHub com o token do criador, sem timeout (nenhum AbortSignal, e o Octokit não tem padrão). Com o GitHub lento, "Carregando suas jams..." fica até o limite da função; repete em toda visita enquanto houver pendente, e qualquer participante gasta o limite de API do criador.'
    suggested_action: 'Orçamento curto (cerca de 1,5 s) com o resto em after(), e limitar a frequência por linha.'
  - id: 'REL-002'
    severity: low
    finding: 'Convite recusado ou vencido deixa o participante pendente para sempre: o link "Aceite o convite" leva a uma página sem convite e a sincronização continua consultando o GitHub.'
    suggested_action: 'Quando não for colaborador, conferir o convite pelo invitee.id e voltar para falhou com o motivo.'
  - id: 'SEC-003'
    severity: low
    finding: 'Se o DELETE do convite errado falha, o erro é engolido sem log, e a mensagem diz que foi cancelado (raríssimo: troca de login no meio do pedido e falha do DELETE).'
    suggested_action: 'Logar com o id do convite, tentar de novo e orientar o criador a cancelar no GitHub.'
  - id: 'SEC-004'
    severity: low
    finding: 'desfazerAmizade não mexe em participante: o ex-amigo pendente continua na jam, ocupa a vaga e pode aceitar o convite. Sair e tirar participante estão fora do escopo do Epic 2.'
    suggested_action: 'Registrar na A10 ou A13, ou cancelar o convite pendente ao desfazer a amizade numa story futura.'
  - id: 'UX-002'
    severity: low
    finding: 'Depois do painel de resultado, o formulário de criar continua ativo (clicar de novo dá jam_ja_existe, ou cria outra jam com outro nome); em falha de rede o painel diz que ninguém foi chamado, mas a ação pode ter rodado; "Tentar de novo" aparece em jam fechada e sempre falha.'
    suggested_action: 'Trocar o formulário pelo painel, dizer "confira no Início" na falha de rede e esconder o botão em jam que não está aberta.'
  - id: 'TEST-002'
    severity: low
    finding: 'A guarda dentro do insert não tem teste próprio; a simulação do 23505 não prova a vaga seguinte com a anterior ocupada; sem teste para a falha do cancelamento e os motivos 404, 422 e reautenticar; inicio.test.tsx confere só expect.any(Function) na fábrica do GitHub.'
    suggested_action: 'Testes desses ramos.'
  - id: 'PERF-002'
    severity: low
    finding: 'O refresh() da ação re-renderiza /jams/nova (com a lista de repositórios do GitHub) logo antes do router.push.'
    suggested_action: 'Não atualizar a nova jam quando a tela vai sair dela.'

resolved_issues: ['SEC-001', 'SEC-002', 'REL-001', 'UX-001', 'TEST-001']

